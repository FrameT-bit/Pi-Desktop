# pi-desktop — example for ~/.config/pi-desktop/config.ini
# Copy to ~/.config/pi-desktop/config.ini; the app reads this file at boot.
# Empty value = omit the corresponding Pi flag. Unknown keys survive a GUI save.

[ui]
# code = full interface; chat = conversation mode (last choice is remembered).
view=code
# The header button alternates between these two themes, keeping both choices.
theme=system
light_theme=light
dark_theme=dark
session_tabs=false
timestamps=true
auto_scroll=true
chat_width=78
font_scale=100
show_costs=true
notify=true
# Tool and diff cards start collapsed; true keeps them open by default.
cards_expanded=false
# Feature toggles. Each one adds instructions to the system prompt.
# Images returned by tools are shown inline where the tool ran.
ai_images=true
# Allow the model to ask a pi-clarify question (buttons + free text).
clarify=true
# Sub-agent model tier inside the current model family: off|best|balanced|cheap.
subagent_tier=balanced
# Per-family overrides written by Settings, e.g.
# openai=best:openai/gpt-5-pro,balanced:openai/gpt-5,cheap:openai/gpt-5-mini
subagent_models=

[pi]
# local = run `cd <workspace> && exec pi <args>`
# remote = ssh -T <remote_ssh> <remote_cmd>
target=local
bin=~/.local/bin/pi
remote_ssh=
# Empty = build `cd <workspace> && exec pi <args>`
remote_cmd=
workspace=~/projects
session_id=desktop
# true = open the most recent conversation; false = start a new session.
start_last=false
# Empty = the Pi default session directory.
session_dir=
# In-memory session, not written to disk.
no_session=false

# session and model
name=
# Accepts provider/id:thinking; empty = Pi decides.
model=
# Auxiliary model for titles and probes; empty = session model.
aux_model=
# Globs for Ctrl+P, comma-separated.
models=
provider=
# off|minimal|low|medium|high|xhigh|max; empty = Pi decides.
thinking=

# tools
tools=
exclude_tools=
no_tools=false
no_builtin_tools=false
no_mcp=false
approve=ask
offline=false

# extensions and context
skills=
no_skills=false
extensions=
no_extensions=false
prompt_templates=
no_prompt_templates=false
no_context_files=false
system_prompt=
append_system_prompt=
